# Вход только по ключу (22.10.2026): адрес сервера есть в публичном репозитории.
# Файл читается первым (00-), а в sshd побеждает первое значение — 50-cloud-init.conf его не перебьёт.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# Ставится: cp ops/sshd_00-kraken-keys-only.conf /etc/ssh/sshd_config.d/00-kraken-keys-only.conf && sshd -t && systemctl reload ssh
